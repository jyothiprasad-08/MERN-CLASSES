<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color: rgb(73, 1, 19);
            background-color: rgba(107, 139, 13, 0.952);
        }
        p {
            color: rgb(149, 16, 16);
            font-size: 16px;
        }
            ul {
                color: rgb(16, 149, 16);
                font-size: 16px;
            }
            li {
                color: rgb(16, 149, 16);
                font-size: 16px;
            }
    </style>
</head>
<body>
    <h1 style="color: blue; background-color: lightgray !important;">welcome to the css</h1>
    <p style="color: rgb(174, 15, 66); font-size: 16px;">This is a simple paragraph.</p>
    <h1>example for order list</h1>
    <p></p>
    <ul>
        <li style="background-color: rgb(198, 113, 23);">Item 1</li>
        <li>Item 2</li>
        <li style="color: rgb(149, 65, 16); font-size: 16px;">Item 3</li>
    </ul>
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li style="color: rgb(16, 149, 16); font-size: 16px;">Item 3</li>
    </ol>
</body>
</html>
