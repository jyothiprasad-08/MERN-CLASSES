<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ol+h1 {
            color: blue;
        }
        ul p {
            color: red;
        }
        li:first-child {
            color: green;
        }   
        li:last-child {
            color: orange;
        }   
            li:nth-child(2) {
                color: purple;
            }   
            li:nth-child(3) {
                color: pink;
            }   
            li:nth-child(4) {
                color: brown;
            }   
            li:nth-child(5) {
                color: cyan;
            }
            

    </style>
</head>
<body>
    <h1>ordered list</h1>
    <ol>
        <li>list</li>
        <li>list2</li>
        <li>list3</li>
        <li>list4</li>

    </ol>
    <div>
        <button style="background-color: blue;">submit</button>

    </div>
    <h1>unordered list</h1>
    <ul>
        <li>list</li>
        <li>list2</li>
        <li>list3</li>
        <li>list4</li>
        <li>
            <p>hello</p>
        </li>
    </ul>
<h1>akash</h1>
<p>gfdhprasad</p>
</body>
</html>
