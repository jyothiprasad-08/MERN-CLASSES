<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>
            <button type="submit">submit</button>
            <button type="reset">Reset</button>

        </fieldset>
    </form>
    <script>
        let uname = document.getElementById("username");
        let pass = document.getElementById("password");
        let form = document.querySelector("form");

        form.addEventListener("submit",(e)=>{
            e.preventDefault();
            console.log("Username:",uname.value);
            console.log("Password:",pass.value);
            window.localStorage.setItem("username",uname.value);
            window.localStorage.setItem("password",pass.value);
            
            let storedUsername = window.localStorage.getItem("username");
            let storedPassword = window.localStorage.getItem("password");
            console.log("Stored Username:", storedUsername);
            console.log("Stored Password:", storedPassword);
            window.open("id.html","_blank");    
            form.reset();

        });
    </script>
    
</body>
</html>
