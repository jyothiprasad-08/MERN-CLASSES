<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let userDetails = function (username, password) {

            console.log("This is functional expression");
            return username + " " + password
        }
        
        let result = userDetails('ravi@123', "admin@123");
        console.log(userDetails("ramu", "ramu@123"));
        console.log(result);
        userDetails()

        //normal function

        function employeeDetails(name,role,salary,address) {
            // console.log("This is Normal Function..");
            // console.log("name:",name);
            // console.log("role:",role);
            // console.log("salary:",salary);
            // console.log("address:",address);
            return[name,role,salary,address]
        }
       
        let emp1= employeeDetails("teja","developer",900000,"america");
       console.log(emp1);

       //immediate invoking function
        (function(){
            let apiKey="AIzaSyApeYoB_YEn3e9IQjGjo4w6Acsr7Qw4IwQ";
            console.log("This is immediate invoking function");
            console.log("API Key:",apiKey);
        })()

        //arrow function         
        
        let arrowfun=()=>console.log("Arrow function")
        arrowfun();

        let test=(skill,name)=>{
            let a=10;
            let b=20;
            console.log(a,b);
            console.log("Name:",name,"Skill:",skill);
        }
        test(["nodejs","reactjs","expressjs","mongodb"],"teja");

        //nested function

        function outerFunction() {
            function innerFunction() {
                console.log("This is inner function");
            }
            console.log("This is outer function");
            innerFunction();
        }
        outerFunction();
        function homepage() {
            console.log("This is homepage function");
            function aboutpage() {
                console.log("This is aboutpage function");
                function contactpage() {
                    console.log("This is contactpage function");
                }
                contactpage();
            }
            aboutpage();
        }
        homepage();
        //function generator
        function* generatorFunction() {
            yield "This is first yield statement";
            yield "This is second yield statement";
            yield "This is third yield statement";
        }   
        let generatorObject = generatorFunction();
        console.log(generatorObject.next().value);
        //object function
        let obj = {
            name: "teja",
            role: "developer",
            salary: 900000,
            address: "america",
            details: function() {
                console.log("Name:", this.name);
                console.log("Role:", this.role);
                console.log("Salary:", this.salary);
                console.log("Address:", this.address);
            }
        }
        obj.details();  
        
    </script>
</body>
</html>
