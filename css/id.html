<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .id-card {
            width: 400px;
            background-color: #fff;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #ddd;
            text-align: center;
            position: relative;
        }

        .header h2 {
            margin: 0;
            font-size: 14px;
            color: #b31b1b; /* Deep Red */
            text-transform: uppercase;
            line-height: 1.2;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 10px;
            color: #110f0f;
            font-weight: bold;
        }

        .photo-area {
            padding: 20px 0;
        }

        .photo-area img {
            width: 130px;
            height: 160px;
            border: 2px solid #ccc;
            object-fit: cover;
            border-radius: 5px;
        }

        .details {
            padding: 10px 20px 30px;
            text-align: left;
        }

        .detail-row {
            margin-bottom: 10px;
            display: flex;
        }

        .label {
            font-weight: bold;
            color: #333;
            width: 100px;
            font-size: 14px;
        }

        .value {
            color: #2a2828;
            font-size: 14px;
            flex: 1;
            font-weight: bold;
        }

        .name-row {
            text-align: center;
            margin-bottom: 15px;
        }

        .full-name {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            text-transform: uppercase;
        }

        .footer {
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-top: 1px dashed #ccc;
        }

        .signature {
            text-align: center;
        }

        .signature p {
            margin: 0;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            border-top: 1px solid #333;
            padding-top: 5px;
        }
    </style>
</head>
<body>

    <div class="id-card">
        <div class="header">
            <img src="https://resources.saylor.org/wwwresources/wp-content/uploads/20200717101134/BITS-VIzag-logo.jpg" alt="College Logo" style="width: 300px; height: 100px;" align="center">
            <h2>Baba Institute of Technology and Sciences</h2>
            <p>Accredited by NAAC with "A" Grade</p>
            <p>ISO 9001:2015 Certified Institution</p>
        </div>

        <div class="photo-area">
            <img src="https://s.yimg.com/zb/imgv1/dac92c4b-5946-37df-92e5-65cb6790445b/t_500x300" alt="Student Photo">
        </div>

        <div class="details">
            <div class="name-row">
                <div class="full-name">Name: HARDHIK PANDYA</div>
            </div>

            <div class="detail-row">
                <span class="label" align="center">Regd. No :</span>
                <span class="value">23NR1A0594</span>
            </div>

            <div class="detail-row">
                <span class="label" align="center">Course :</span>
                <span class="value">B.Tech</span>
            </div>

            <div class="detail-row">
                <span class="label" align="center">Branch :</span>
                <span class="value">CSE</span>
            </div>
        </div>

        <div class="footer">
            <div class="signature" style="font-style:italic;">
                <img src="https://tse1.mm.bing.net/th/id/OIP.uCh_iKMuTAQIVETvRV_OKgHaDV?pid=Api&P=0&h=180" alt="Signature" style="width: 70px; height: 20px; font-weight: bold;">
                <p>PRINCIPAL</p>
            </div>
        </div>
    </div>

</body>
</html>
