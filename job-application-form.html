<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(203, 109, 16);
        }
        form{
            background-image: url(https://img.freepik.com/free-vector/gradient-orange-background_23-2148888827.jpg?w=2000);
            width: 500px;
            height: 700px;
            margin: auto;
            padding: 20px;
        }
    button{
    background-color: rgba(22, 22, 33, 0.142);
    color: rgb(17, 152, 150);
    border: none;
    padding: 10px 20px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
    margin: 4px 2px;
    cursor: pointer;
    }
    h1{
        text-align: center;
    }

    </style>
</head>
<body>
    <form action="" alin="left"> >
        <fieldset>
            <h1>JOB APPLICATION</h1>
            <label for="fname">First name</label>
            <input type="text" id="fname" maxlength="8" minlength="3" required placeholder="FIRST NAME">
            <br><br>
            <label for="lname">Last name</label>
            <input type="text" id="lname" maxlength="6" minlength="3" placeholder="LAST NAME">
            <br><br>
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="Email">
            <br><br>
            <label for="DOB"> Date of birth </label>
            <input type="date" id="DOB" required placeholder="DOB">
            <br><br>
            <label for="phno">Telephone</label>
            <input type="tel" pattern="[6-9]{1}[0-9]{9}" id="phno" maxlength="10" required placeholder="phone number">
            <br><br>
            <label for="states">states</label>
            <select name="" id="states">
                <option value="ap">ap</option>
                <option value="up">up</option>
                <option value="">ts</option>

            </select>
            <br>
                <br>
                <label for="age"> age</label>
                <input type="number" id="age" required maxlength="3" min="22"  max="45" placeholder="Age">

                <br><br>
                <label for="address">address</label>
                <textarea name="" rows="3" cols="30" id="address" placeholder="ENTER FULL ADDRESS"></textarea>
                <br><br>
                <label for="gender">gender</label>
                
<input type="radio" id="gender" name="gender" value="male">male
<input type="radio" id="gender" name="gender" value="female">female
<br><br>
<label for="files">files</label>
<input type="file" name="" id="files" accept="jpg,.doc,">
<br><br>
<label for="skills">skills</label>
<input type="checkbox" name="" id="skills">html
<input type="checkbox" name="" id="">java
<br><br>
<label for="lang">language</label>
<input type="range" name="telugu" id="lang" telugu>telugu
<input type="range" name="" id="">english
<br><br>
<label for="resume">upload resume</label>
<input type="file" name="" id="resume" accept=".doc,.pdf,.docx" placeholder=" upload resume">
<br><br>
<button type="submit">submit</button>
<button type="clear">clear</button>
<br>


            </select>

        </fieldset>
    </form>
    
</body>
</html>
